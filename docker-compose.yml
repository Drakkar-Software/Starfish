version: "3.8"
services:
  starfish-ts:
    build:
      context: .
      dockerfile: packages/ts/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  starfish-python:
    build:
      context: .
      dockerfile: packages/python/server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
