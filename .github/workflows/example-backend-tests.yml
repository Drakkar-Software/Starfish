name: Example Backend Tests

on:
  push:
    branches:
      - "master"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: examples/app/backend/uv.lock

      - name: Run example backend tests
        working-directory: examples/app/backend
        run: uv run --python 3.12 pytest tests/ -v
