name: Example Backend Tests

on:
  push:
    branches:
      - "master"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run example backend tests
        working-directory: examples/app/backend
        run: uv run pytest tests/
