name: Publish Python Packages to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - "master"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install protocol
        working-directory: packages/python/protocol
        run: uv pip install --system -e ".[dev]"

      - name: Run protocol tests
        working-directory: packages/python/protocol
        run: pytest -v

      - name: Install server dependencies
        working-directory: packages/python/server
        run: uv pip install --system -e ".[dev]"

      - name: Run server tests
        working-directory: packages/python/server
        run: pytest -v

      - name: Install client dependencies
        working-directory: packages/python/client
        run: uv pip install --system -e ".[dev]"

      - name: Run client tests
        working-directory: packages/python/client
        run: pytest -v

      - name: Install keyring dependencies
        working-directory: packages/python/keyring
        run: uv pip install --system -e ".[dev]"

      - name: Run keyring tests
        working-directory: packages/python/keyring
        run: pytest -v

      - name: Install identities dependencies
        working-directory: packages/python/identities
        run: uv pip install --system -e ".[dev]"

      - name: Run identities tests
        working-directory: packages/python/identities
        run: pytest -v

      - name: Install sharing dependencies
        working-directory: packages/python/sharing
        run: uv pip install --system -e ".[dev]"

      - name: Run sharing tests
        working-directory: packages/python/sharing
        run: pytest -v

      - name: Install entitlements dependencies
        working-directory: packages/python/entitlements
        run: uv pip install --system -e ".[dev]"

      - name: Run entitlements tests
        working-directory: packages/python/entitlements
        run: pytest -v

      - name: Install restrictions dependencies
        working-directory: packages/python/restrictions
        run: uv pip install --system -e ".[dev]"

      - name: Run restrictions tests
        working-directory: packages/python/restrictions
        run: pytest -v

      - name: Install audit dependencies
        working-directory: packages/python/audit
        run: uv pip install --system -e ".[dev]"

      - name: Run audit tests
        working-directory: packages/python/audit
        run: pytest -v

      - name: Install queuing dependencies
        working-directory: packages/python/queuing
        run: uv pip install --system -e ".[dev]"

      - name: Run queuing tests
        working-directory: packages/python/queuing
        run: pytest -v

      - name: Install replica dependencies
        working-directory: packages/python/replica
        run: uv pip install --system -e ".[dev]"

      - name: Run replica tests
        working-directory: packages/python/replica
        run: pytest -v

      - name: Install projection dependencies
        working-directory: packages/python/projection
        run: uv pip install --system -e ".[dev]"

      - name: Run projection tests
        working-directory: packages/python/projection
        run: pytest -v


      - name: Install outbox dependencies
        working-directory: packages/python/outbox
        run: uv pip install --system -e ".[dev]"

      - name: Run outbox tests
        working-directory: packages/python/outbox
        run: pytest -v

  setup:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      py_version: ${{ steps.meta.outputs.py_version }}
    steps:
      - name: Compute PEP 440 version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Convert semver pre-release to PEP 440: 3.0.0-alpha.0 → 3.0.0a0, -beta.1 → b1, -rc.2 → rc2
          PY_VERSION=$(echo "$VERSION" \
            | sed 's/-alpha\.\([0-9]*\)/a\1/' \
            | sed 's/-beta\.\([0-9]*\)/b\1/' \
            | sed 's/-rc\.\([0-9]*\)/rc\1/')
          echo "py_version=$PY_VERSION" >> $GITHUB_OUTPUT

  publish-protocol:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version from tag
        working-directory: packages/python/protocol
        env:
          PY_VERSION: ${{ needs.setup.outputs.py_version }}
        run: |
          python -c "
          import re, os
          version = os.environ['PY_VERSION']
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(r'^version = \"[^\"]*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(path, 'w').write(content)
          "

      - name: Build package
        working-directory: packages/python/protocol
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/python/protocol
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-client:
    needs: [setup, publish-protocol]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version from tag
        working-directory: packages/python/client
        env:
          PY_VERSION: ${{ needs.setup.outputs.py_version }}
        run: |
          python -c "
          import re, os
          version = os.environ['PY_VERSION']
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(r'^version = \"[^\"]*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(path, 'w').write(content)
          "

      - name: Build package
        working-directory: packages/python/client
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/python/client
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-server:
    needs: [setup, publish-protocol]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version from tag
        working-directory: packages/python/server
        env:
          PY_VERSION: ${{ needs.setup.outputs.py_version }}
        run: |
          python -c "
          import re, os
          version = os.environ['PY_VERSION']
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(r'^version = \"[^\"]*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(path, 'w').write(content)
          "

      - name: Build package
        working-directory: packages/python/server
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/python/server
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-keyring:
    needs: [setup, publish-client]
    runs-on: ubuntu-latest
    permissions:
