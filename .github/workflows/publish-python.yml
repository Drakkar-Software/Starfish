      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version from tag
        working-directory: packages/python/keyring
        env:
          PY_VERSION: ${{ needs.setup.outputs.py_version }}
        run: |
          python -c "
          import re, os
          version = os.environ['PY_VERSION']
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(r'^version = \"[^\"]*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(path, 'w').write(content)
          "

      - name: Build package
        working-directory: packages/python/keyring
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/python/keyring
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-identities:
    needs: [setup, publish-keyring]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version from tag
        working-directory: packages/python/identities
        env:
          PY_VERSION: ${{ needs.setup.outputs.py_version }}
        run: |
          python -c "
          import re, os
          version = os.environ['PY_VERSION']
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(r'^version = \"[^\"]*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(path, 'w').write(content)
          "

      - name: Build package
        working-directory: packages/python/identities
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/python/identities
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-sharing:
    needs: [setup, publish-keyring]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version from tag
        working-directory: packages/python/sharing
        env:
          PY_VERSION: ${{ needs.setup.outputs.py_version }}
        run: |
          python -c "
          import re, os
          version = os.environ['PY_VERSION']
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(r'^version = \"[^\"]*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(path, 'w').write(content)
          "

      - name: Build package
        working-directory: packages/python/sharing
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/python/sharing
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-entitlements:
