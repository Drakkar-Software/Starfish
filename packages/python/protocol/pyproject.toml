[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starfish-protocol"
version = "3.0.0a11"
description = "Shared protocol primitives for the Starfish sync protocol"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=41.0",
    # BIP-340 Schnorr + secp256k1 ECDH for the "secp256k1-schnorr" suite.
    # `cryptography` has no BIP-340; coincurve wraps libsecp256k1 (C ext).
    "coincurve>=19.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
