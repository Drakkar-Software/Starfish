[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starfish-entitlements"
version = "3.0.0a41"
description = "Starfish entitlements extension (per-user feature-slug role enrichment for the server, plus a client-side entitlement reader)"
requires-python = ">=3.11"
dependencies = [
  "starfish-sdk",
  "starfish-server",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[tool.uv.sources]
starfish-sdk = { path = "../client", editable = true }
starfish-server = { path = "../server", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
