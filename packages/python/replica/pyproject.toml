[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starfish-replica"
version = "3.0.0a71"
description = "Starfish replication extension (primary→replica sync, write modes, on-pull/scheduled triggers, push proxy) as a server plugin"
requires-python = ">=3.11"
dependencies = [
  "starfish-protocol",
  "starfish-server",
  "starfish-identities",
  "httpx>=0.27",
]

[project.optional-dependencies]
space = [
  # Required only by the `starfish_replica.space` subpackage (the space-mirror
  # channel). Kept out of the base `dependencies` so a plain HTTP-replication
  # install does not pull in the spaces stack — the Python analogue of the TS
  # package's `peerDependenciesMeta: { starfish-spaces: { optional: true } }`.
  "starfish-spaces",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "respx>=0.23.1",
  "starfish-spaces",
]

[tool.uv.sources]
starfish-protocol = { path = "../protocol", editable = true }
starfish-server = { path = "../server", editable = true }
starfish-identities = { path = "../identities", editable = true }
starfish-spaces = { path = "../spaces", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
