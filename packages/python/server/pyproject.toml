[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starfish-server"
version = "3.0.0a30"
description = "Python server for the Starfish sync protocol"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "cryptography>=41.0",
  "uvicorn>=0.20",
  "httpx>=0.25.0",
  "aiofiles>=23.0",
  "jsonschema>=4.0",
  "starfish-protocol",
]

[project.optional-dependencies]
s3 = ["aiobotocore>=2.5.0"]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "respx>=0.20",
  "starfish-sdk",
  "starfish-keyring",
  "starfish-identities",
  "starfish-sharing",
]

[tool.uv.sources]
starfish-protocol = { path = "../protocol", editable = true }
starfish-sdk = { path = "../client", editable = true }
starfish-keyring = { path = "../keyring", editable = true }
starfish-identities = { path = "../identities", editable = true }
starfish-sharing = { path = "../sharing", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["stress: slow append-only size/scaling stress tests (opt-in)"]
addopts = "-m 'not stress'"
